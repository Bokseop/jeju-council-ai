<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>제주특별자치도의회 AI 전자회의록 검색 시스템</title>
  <meta name="description" content="제주특별자치도의회 2024~2026년 294,780건 실제 공식 회의록 고속 검색 및 발언 라인 자동 이동 시스템">
  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css?v=4.6">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo-area">
        <div class="logo-badge">🏛️</div>
        <div>
          <h1 class="logo-title">제주특별자치도의회 AI 회의록 검색</h1>
          <p class="logo-subtitle">공식 전자회의록 고속 검색 • 매일 아침 06:00 기준 최신화</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="stat-pill" id="statBadge">🏛️ 2024년~현재 525회 회의</span>
        <span class="visitor-pill" title="실시간 웹사이트 방문객 수">
          <img src="https://hits.sh/bokseop.github.io/jeju-council-ai.svg?style=flat-square&label=방문객&color=2563eb" alt="방문객 수" class="visitor-badge-img">
        </span>
        <a href="https://github.com/Bokseop/jeju-council-ai" target="_blank" class="btn-github">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-container">
    <!-- Search Section -->
    <section class="search-section">
      <div class="search-box-wrap">
        <div class="search-input-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="키워드를 입력하세요" autofocus>
          <button id="clearBtn" class="clear-btn" title="검색어 지우기">✕</button>
          <button id="searchBtn" class="search-btn">검색</button>
        </div>
      </div>

      <!-- Year Scope Filter -->
      <div class="year-filter-row">
        <span class="year-filter-label">📅 검색 대상 연도:</span>
        <div class="year-buttons-group">
          <label class="year-btn-label" title="2026년 회의록 검색 포함">
            <input type="checkbox" class="year-checkbox" value="2026" checked>
            <span class="year-btn-pill">2026년 (최신)</span>
          </label>
          <label class="year-btn-label" title="2025년 회의록 검색 포함">
            <input type="checkbox" class="year-checkbox" value="2025">
            <span class="year-btn-pill">2025년</span>
          </label>
          <label class="year-btn-label" title="2024년 회의록 검색 포함">
            <input type="checkbox" class="year-checkbox" value="2024">
            <span class="year-btn-pill">2024년</span>
          </label>
        </div>
        <button type="button" class="btn-all-years" id="btnToggleAllYears">전체 연도 선택</button>
        <span class="year-summary-badge" id="yearSummaryBadge">2026년 대상 검색 중</span>
      </div>

      <!-- Filters Row -->
      <div class="filter-row">
        <div class="filter-item">
          <label for="meetingFilter">🏛️ 회의 선택:</label>
          <select id="meetingFilter">
            <option value="">전체 회의 (525개 회의)</option>
          </select>
        </div>
        <div class="filter-item">
          <label for="speakerFilter">👤 발언자 검색:</label>
          <input type="text" id="speakerFilter" placeholder="의원/공직자 성명">
        </div>
        <div class="filter-item">
          <label for="limitFilter">표시 개수:</label>
          <select id="limitFilter">
            <option value="15">상위 15건</option>
            <option value="30">상위 30건</option>
            <option value="50">상위 50건</option>
          </select>
        </div>
      </div>

      <!-- Benchmark / Results Info -->
      <div class="status-bar" id="statusBar">
        <span>데이터를 불러오는 중입니다...</span>
        <span>🔄 매일 아침 06:00 최신화</span>
      </div>
    </section>

    <!-- Results Section -->
    <section class="results-section" id="resultsContainer">
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>회의록 데이터베이스 색인을 준비 중입니다...</p>
      </div>
    </section>
  </main>

  <!-- Full Meeting Transcript Modal -->
  <div class="modal-overlay" id="meetingModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-box">
          <h2 id="modalMeetingTitle">회의록 전문</h2>
          <p id="modalMeetingMeta">일시 및 발언 통계</p>
        </div>
        <div class="modal-header-actions">
          <a id="modalOfficialLink" href="#" target="_blank" class="btn-primary-sm">🌐 공식 원문 웹페이지 열기</a>
          <button id="modalCopySelectedBtn" class="btn-select-copy" onclick="copySelectedSpeeches()" title="체크된 발언들만 선택 복사">
            ☑️ 선택 복사 (<span id="selectedCountBadge">0</span>)
          </button>
          <button id="modalCopyBtn" class="btn-outline-sm">📋 전체 복사</button>
          <button id="modalCloseBtn" class="btn-close">✕</button>
        </div>
      </div>

      <!-- Modal In-meeting Search -->
      <div class="modal-search-bar">
        <span>🔎 회의록 내 검색:</span>
        <input type="text" id="modalSearchInput" placeholder="단어 또는 의원 이름 검색">
        <button id="modalSearchNextBtn" class="btn-secondary-sm">다음 찾기</button>
        <span id="modalSearchStat" class="search-stat-text"></span>
      </div>

      <!-- Modal View Mode Switcher -->
      <div class="modal-view-mode-bar" id="modalViewModeBar">
        <div class="view-mode-tabs">
          <button id="btnViewContext" class="btn-tab active" onclick="switchModalViewMode('context')">
            🎯 해당 발언 및 전후 맥락 (즉시 표시)
          </button>
          <button id="btnViewFull" class="btn-tab" onclick="switchModalViewMode('full')">
            📜 전체 회의록 모두 보기 (<span id="modalTotalSpeechesCount">0</span>건)
          </button>
        </div>
        <div class="selection-quick-tools">
          <button class="btn-quick-select" onclick="selectAllModalSpeeches()" title="현재 화면의 발언 전체 선택">☑️ 전체 선택</button>
          <button class="btn-quick-select" onclick="clearModalSpeechSelection()" title="선택 모두 해제">⬜ 선택 해제</button>
        </div>
        <div class="view-mode-desc" id="modalViewDesc">
          💡 검색된 발언과 질의·답변 문맥이 스크롤 없이 바로 표시됩니다.
        </div>
      </div>

      <!-- Modal Body -->
      <div class="modal-body" id="modalTranscriptBody">
        <!-- Speeches list populated dynamically -->
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js?v=4.6"></script>
</body>
</html>
