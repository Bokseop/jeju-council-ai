<script>
  const md = "# YouTube Live AI 속기 사용설명서\n\n유튜브 생방송(또는 일반 영상)의 음성을 실시간으로 받아 적어 속기록을 만들어 주는 프로그램입니다.\n이 설명서는 배포용 프로그램(`YouTubeLiveTranscriber.exe`) 기준으로 설치부터 사용, 문제 해결까지 안내합니다.\n\n| 항목 | 내용 |\n| :--- | :--- |\n| 프로그램 | YouTube Live AI Transcriber (v1.2) |\n| 음성 인식 엔진 | faster-whisper `small` 모델 (PC의 CPU에서 동작, 외부 AI 서비스 미사용) |\n| 기준일 | 2026년 10월 15일 |\n\n---\n\n## 목차\n\n1. [무엇을 할 수 있나요](#1-무엇을-할-수-있나요)\n2. [준비물과 설치](#2-준비물과-설치)\n3. [화면 구성](#3-화면-구성)\n4. [사용 방법](#4-사용-방법)\n5. [진행 상태 메시지 안내](#5-진행-상태-메시지-안내)\n6. [저장되는 파일](#6-저장되는-파일)\n7. [자주 묻는 질문과 문제 해결](#7-자주-묻는-질문과-문제-해결)\n\n---\n\n## 1. 무엇을 할 수 있나요\n\n- **실시간 속기**: 유튜브 생방송 주소를 넣고 시작하면 15~60초 단위로 발언이 글자로 바뀌어 화면에 쌓입니다.\n- **일반 영상 속기**: 생방송이 아닌 녹화 영상(다시보기)도 처음부터 끝까지 순서대로 속기합니다.\n- **전문 복사**: 버튼 한 번으로 지금까지의 속기록 전체를 클립보드에 복사합니다.\n- **내보내기**: 속기록을 텍스트(`.txt`) 또는 한글 문서(`.hwpx`) 파일로 저장합니다.\n- **기록 삭제**: 이전에 쌓인 속기록과 임시 파일을 한 번에 지우고 새로 시작합니다.\n\n> 음성 인식은 모두 내 PC 안에서 처리됩니다. 회의 음성이나 속기록이 외부 AI 서비스로 전송되지 않습니다.\n> (유튜브에서 음성을 받아올 때와, 최초 1회 음성 인식 모델을 내려받을 때만 인터넷을 사용합니다.)\n\n---\n\n## 2. 준비물과 설치\n\n### 2-1. 권장 사양\n\n| 항목 | 최소 | 권장 |\n| :--- | :--- | :--- |\n| 운영체제 | Windows 10 64비트 | Windows 11 64비트 |\n| CPU | 4코어 | 8코어 이상 (Intel i5/i7, Ryzen 5/7) |\n| 메모리 | 8 GB | 16 GB |\n| 저장공간 | 여유 3 GB | SSD 권장 |\n| 인터넷 | 안정적인 연결 필수 | 유선 연결 권장 |\n| 기타 | Microsoft Edge WebView2 런타임 (Windows 10/11에 기본 포함) | |\n\n### 2-2. 설치\n\n1. 배포받은 `YouTubeLiveTranscriber.zip` 파일을 원하는 폴더에 **압축 해제**합니다. (예: `D:\\속기프로그램\\`)\n2. 압축을 풀면 아래 세 가지가 **같은 폴더에** 있어야 합니다. 하나라도 옮기거나 지우면 실행되지 않습니다.\n\n```\nYouTubeLiveTranscriber.exe   ← 실행 파일\nffmpeg.exe                   ← 음성 변환 도구\n_internal\\                   ← 프로그램 구성 파일 폴더\n```\n\n3. `YouTubeLiveTranscriber.exe`를 더블클릭하면 프로그램 창이 열립니다.\n\n#### 압축 파일이 2개로 나뉘어 있는 경우\n\n`YouTubeLiveTranscriber_1of2.zip`, `YouTubeLiveTranscriber_2of2.zip` 두 파일을 **모두** 받아 **같은 폴더에** 풀어야 합니다.\n\n- **반디집/알집**: 두 파일을 함께 선택 → 마우스 오른쪽 → [여기에 풀기]\n- **Windows 기본 기능**: 두 파일 모두 [압축 풀기]를 하되, 대상 폴더를 **같은 폴더**(예: `D:\\속기프로그램`)로 지정합니다. Windows가 자동으로 붙이는 `_1of2`, `_2of2` 폴더 이름은 지워 주세요.\n- 다 풀면 `YouTubeLiveTranscriber` 폴더 안에 위의 세 가지가 모두 들어 있어야 합니다.\n\n> 게시판이나 웹드라이브에서 브라우저로 내려받은 파일도 따로 [차단 해제]를 할 필요 없이 바로 실행됩니다.\n> (프로그램이 시작할 때 자기 파일에 붙은 \"인터넷에서 받은 파일\" 표시를 스스로 풉니다.)\n\n> **처음 실행할 때 주의**\n> 처음으로 [전사 시작]을 누르면 음성 인식 모델(약 480 MB)을 인터넷에서 내려받습니다.\n> 네트워크 상황에 따라 수 분이 걸릴 수 있으며, 진행 상태에 \"음성 인식 모델 로딩 중...\"으로 표시됩니다.\n> 한 번 받은 모델은 PC에 저장되어(`C:\\Users\\사용자이름\\.cache\\huggingface`) 다음부터는 바로 시작됩니다.\n\n> Windows 보안(SmartScreen) 경고가 뜨면 [추가 정보] → [실행]을 누르세요.\n\n---\n\n## 3. 화면 구성\n\n![프로그램 전체 화면](YouTube_Live_AI_속기_사용설명서_images/01_main.png)\n\n| 번호 | 이름 | 설명 |\n| :---: | :--- | :--- |\n| ① | URL 입력창 | 속기할 유튜브 주소를 붙여 넣습니다. |\n| ② | 전사 주기 | 몇 초 분량씩 묶어서 받아 적을지 고릅니다. (15초 / 30초 / 60초, 기본 30초) |\n| ③ | 전사 시작 / 중지 | 속기를 시작합니다. 시작하면 같은 자리에 빨간 [중지] 버튼이 나타납니다. |\n| ④ | 내보내기 | 속기록을 `.txt` 또는 `.hwpx` 파일로 저장합니다. |\n| ⑤ | 생방송 스트림 뷰어 | 입력한 영상이 재생됩니다. 화면과 속기 내용을 비교해 볼 수 있습니다. |\n| ⑥ | 진행 상태 | 프로그램이 지금 무엇을 하고 있는지, 오류가 있는지 알려 줍니다. ([5장](#5-진행-상태-메시지-안내) 참고) |\n| ⑦ | 자동 스크롤 | 켜 두면 항상 가장 최근 발언이 보이도록 화면이 아래로 따라갑니다. |\n| ⑧ | 전문 복사 | 지금까지의 속기록 전체를 클립보드에 복사합니다. |\n| ⑨ | 기록 삭제 | 저장된 이전 속기록과 임시 파일을 모두 지웁니다. |\n| ⑩ | 실시간 누적 전문 | 속기 결과가 `[시각] 발언 내용` 형태로 쌓입니다. 오래된 발언은 위로 올라가고, 최신 발언은 맨 아래에 붙습니다. |\n| ⑪ | 누적 문장 | 화면에 표시된 발언 건수입니다. |\n\n그 밖에 시스템 모니터링 칸의 **최근 수신 시퀀스**는 유튜브에서 받아 온 마지막 음성 조각 번호, **가동 시간**은 속기를 시작한 뒤 흐른 시간입니다.\n\n---\n\n## 4. 사용 방법\n\n### 4-1. 속기 시작하기\n\n1. 유튜브에서 속기할 생방송(또는 영상) 페이지의 주소를 복사합니다.\n   예: `https://www.youtube.com/watch?v=XXXXXXXXXXX`\n2. ① URL 입력창의 기존 주소를 지우고 붙여 넣습니다.\n3. ② 전사 주기를 고릅니다. 처음에는 **30초**를 권장합니다.\n4. ③ [**전사 시작**]을 누릅니다.\n5. 화면 상단에 빨간 **LIVE** 표시가 켜지고, ⑥ 진행 상태가 아래 순서로 바뀝니다.\n   `음성 인식 모델 로딩 중` → `스트림 주소 확인 중` → `실시간 수집 중` → `음성 인식 중`\n6. 전사 주기만큼 시간이 지나면 ⑩에 첫 문장이 나타나고, 이후 주기마다 계속 쌓입니다.\n\n> **구간 끝에 걸친 문장은 다음 구간과 함께 표시됩니다.**\n> 프로그램은 음성을 주기 단위로 잘라 받아 적습니다. 마지막 문장이 잘리는 지점에 걸리면 바로 내보내지 않고,\n> 다음 구간 음성과 이어 붙여 다시 받아 적습니다. 그래서 문장이 중간에 빠지지 않는 대신, 마지막 문장은 한 주기 늦게 나타날 수 있습니다.\n> [중지]를 누르거나 방송이 끝나면 남아 있던 문장까지 마저 받아 적어 표시합니다.\n\n> **생방송은 [전사 시작]을 누른 시점부터 받아 적습니다.** 시작 버튼을 누르기 전의 방송 내용은 속기되지 않으니,\n> 회의 시작 전에 미리 켜 두세요.\n\n#### 전사 주기 고르는 법\n\n| 주기 | 특징 |\n| :--- | :--- |\n| 15초 | 화면에 빨리 뜨지만, 문장이 중간에 잘리는 경우가 많고 CPU를 더 많이 씁니다. |\n| 30초 (권장) | 속도와 정확도의 균형이 가장 좋습니다. |\n| 60초 | 문장이 덜 잘리고 CPU 부담이 적지만, 화면에 뜨기까지 1분 이상 걸립니다. |\n\n#### 시각 표시 기준\n\n- **생방송**: 해당 구간의 받아쓰기가 끝난 **PC 시각**이 표시됩니다. 실제 발언보다 전사 주기만큼(약 15~60초) 늦게 찍힙니다.\n- **일반 영상**: 해당 발언이 시작되는 **재생 위치**(영상 처음부터 따진 시간, `00:05:30` 등)가 표시됩니다.\n\n### 4-2. 속기 중지하기\n\n- 빨간 **[중지]** 버튼을 누르면 새 음성 수집을 멈춥니다. 이미 받아 적은 속기록은 그대로 남습니다.\n- 다시 [**전사 시작**]을 누르면 그 시점의 생방송부터 이어서 받아 적으며, 기존 속기록 아래에 계속 쌓입니다.\n- 중지 직후 바로 다시 시작하면 \"이전 작업을 정리하는 중입니다\" 안내가 뜰 수 있습니다. 몇 초 뒤 다시 누르세요.\n- 생방송이 끝나면 자동으로 멈추고 \"생방송이 종료되었습니다.\"가 표시됩니다.\n\n### 4-3. 최근 발언 보기와 자동 스크롤\n\n- ⑦ **자동 스크롤**을 켜 두면 새 발언이 들어올 때마다 화면이 맨 아래(최신 발언)로 이동합니다.\n- 지난 발언을 위로 올려 읽고 싶을 때는 자동 스크롤을 **잠시 끄세요.** 켜져 있으면 2초 안에 다시 맨 아래로 돌아갑니다.\n- 다 읽은 뒤 다시 켜면 곧바로 최신 발언 위치로 이동합니다.\n\n### 4-4. 전문 복사\n\n![전문 복사 버튼](YouTube_Live_AI_속기_사용설명서_images/04_copy_button.png)\n\n1. ⑧ [**전문 복사**]를 누릅니다.\n2. 버튼이 잠시 \"복사됨!\"으로 바뀌고, 화면 아래에 복사한 줄 수가 표시됩니다.\n3. 한글, 메모장, 메신저 등에 `Ctrl + V`로 붙여 넣습니다.\n\n복사되는 형식은 다음과 같습니다.\n\n```\n[15:36:10] 과거에 만들어진 정부가 기구에 얽혀가는 대행체제의 유지가 맞는 걸로 보이시나요?\n[15:36:10] 저는 옳지 않다고 생각하는데.\n```\n\n### 4-5. 내보내기 (txt / hwpx 저장)\n\n![내보내기 메뉴](YouTube_Live_AI_속기_사용설명서_images/02_export_menu.png)\n\n1. ④ **[내보내기]** 버튼 위에 마우스를 올리면 메뉴가 펼쳐집니다.\n2. 원하는 형식을 누릅니다.\n   - **텍스트 (.txt)**: `[시각] 발언 내용`이 한 줄씩 들어간 일반 텍스트 파일\n   - **한글 (.hwpx)**: 한글 프로그램에서 바로 열리는 문서. 제목(\"실시간 생방송 녹취록\"), 추출 일시, 영상 제목·주소, 총 발언 건수가 맨 위에 들어가고, 시각은 파란 굵은 글씨로 표시됩니다.\n3. 저장 위치를 고르는 창이 뜨면 폴더와 파일 이름을 정하고 [저장]을 누릅니다.\n   기본 파일 이름은 `transcript_연월일_시분.txt` / `.hwpx` 입니다.\n4. 저장이 끝나면 화면 아래에 \"저장 완료: (파일 경로)\"가 표시됩니다.\n\n> `.hwpx` 파일은 **한글 2018 이상**에서 열 수 있습니다.\n\n### 4-6. 기록 삭제 (새로 시작하기)\n\n프로그램은 껐다 켜도 이전 속기록을 그대로 다시 불러옵니다. 새 회의를 깨끗하게 시작하려면 이전 기록을 지우세요.\n\n![기록 삭제 확인 창](YouTube_Live_AI_속기_사용설명서_images/03_clear_dialog.png)\n\n1. 필요한 내용은 먼저 **내보내기**로 저장해 둡니다.\n2. 속기 중이라면 [**중지**]를 먼저 누릅니다. (속기 중에는 삭제되지 않습니다.)\n3. ⑨ [**기록 삭제**]를 누르면 확인 창이 뜨고, 지워질 속기록 건수가 표시됩니다.\n4. [**모두 삭제**]를 누르면 삭제되고, [취소]를 누르면 아무것도 지워지지 않습니다.\n5. 완료되면 \"이전 기록 N건을 모두 삭제했습니다.\"가 표시되고 화면이 비워집니다.\n\n> **삭제한 기록은 되돌릴 수 없습니다.** 내보내기로 따로 저장해 둔 `.txt` / `.hwpx` 파일은 지워지지 않습니다.\n\n---\n\n## 5. 진행 상태 메시지 안내\n\n⑥ 진행 상태 칸에 표시되는 메시지의 의미입니다. 오류는 빨간 글씨로 표시됩니다.\n\n| 메시지 | 의미 / 할 일 |\n| :--- | :--- |\n| 대기 중 | 속기를 시작하지 않은 상태입니다. |\n| 음성 인식 모델 로딩 중... | 음성 인식 엔진을 준비하고 있습니다. 첫 실행 시에는 모델을 내려받느라 수 분 걸릴 수 있습니다. |\n| 스트림 주소 확인 중... | 유튜브에서 음성 주소를 받아 오는 중입니다. 보통 수 초~십여 초 걸립니다. |\n| 실시간 수집 중 · 다음 전사까지 10/30초 | 생방송 음성을 모으는 중입니다. 전사 주기(예: 30초)만큼 모이면 받아쓰기를 시작합니다. 모으는 동안에도 음성은 빠짐없이 계속 받습니다. |\n| 음성 인식 중... | 모은 음성을 글자로 바꾸는 중입니다. |\n| 영상 음성 처리 중 · 00:05:00 / 01:20:00 | (일반 영상) 현재 처리 위치 / 전체 길이입니다. |\n| 생방송이 종료되었습니다. | 방송이 끝나 자동으로 멈췄습니다. |\n| 전사 완료 | (일반 영상) 끝까지 속기를 마쳤습니다. |\n| 중지됨 | [중지] 버튼으로 멈춘 상태입니다. |\n| 스트림 재연결 중... (n회) | 유튜브 연결이 두 번 이상 연속으로 끊겨 다시 연결하는 중입니다. 한 번 끊기는 정도는 표시 없이 자동으로 다시 시도합니다. 대부분 자동으로 복구되며, 끊긴 동안의 음성도 다시 받아 오므로 빠지지 않습니다. |\n| 오류: ... | 속기가 멈췄습니다. 내용을 확인하고 [7장](#7-자주-묻는-질문과-문제-해결)을 참고해 다시 시작하세요. |\n| 이전 기록을 모두 삭제했습니다. | 기록 삭제가 완료되었습니다. |\n\n---\n\n## 6. 저장되는 파일\n\n속기록은 내보내기를 하지 않아도 **프로그램 폴더**(`YouTubeLiveTranscriber.exe`가 있는 폴더)에 자동으로 저장됩니다.\n\n| 파일 / 폴더 | 내용 | 기록 삭제 시 |\n| :--- | :--- | :--- |\n| `live_transcript.json` | 속기록 전체 (프로그램을 다시 켤 때 이 파일을 불러옵니다) | 비워짐 |\n| `live_transcript.txt` | 속기록을 한 줄씩 기록한 텍스트 | 삭제 |\n| `live_chunks\\` | 유튜브에서 받은 5초 단위 음성 조각 (임시) | 안의 파일 삭제 |\n| `live_batch.wav`, `live_batch_concat.txt` | 받아쓰기용 임시 음성 파일 | 삭제 |\n\n> 프로그램 폴더는 쓰기 권한이 있는 곳(예: `D:\\`, 바탕화면, 문서 폴더)에 두세요.\n> `C:\\Program Files` 같은 곳에 두면 저장이 되지 않을 수 있습니다.\n\n---\n\n## 7. 자주 묻는 질문과 문제 해결\n\n### Q1. [전사 시작]을 눌렀는데 글자가 안 나와요.\n\n⑥ 진행 상태를 먼저 확인하세요.\n\n- **\"음성 인식 모델 로딩 중...\"에서 오래 멈춰 있음**: 첫 실행 시 모델(약 480 MB)을 내려받는 중입니다. 수 분 기다려 주세요. 회사 보안망 등으로 다운로드가 막히면 \"오류:\"가 표시됩니다. 이 경우 전산 담당자에게 `huggingface.co` 접속 허용을 요청하세요.\n- **\"실시간 수집 중\"이 계속 바뀌고 있음**: 정상입니다. 전사 주기(예: 30초)만큼 모인 뒤 첫 문장이 나옵니다.\n- **회의장이 조용함**: 발언이 없는 구간(정회, 대기 화면)은 받아 적을 내용이 없어 아무것도 추가되지 않습니다.\n- **\"오류: 영상에서 음성 스트림을 찾지 못했습니다\"**: 주소가 잘못되었거나, 비공개·연령 제한·삭제된 영상입니다. 유튜브에서 주소가 정상적으로 재생되는지 확인하세요.\n\n### Q2. 생방송 앞부분은 왜 속기가 안 되어 있나요?\n\n생방송은 [전사 시작]을 누른 시점부터 받아 적습니다. 회의 시작 전에 미리 시작해 두세요.\n지난 부분이 필요하면 방송이 끝난 뒤 다시보기 영상 주소로 속기하면 처음부터 받아 적습니다.\n\n### Q3. 다른 단어로 잘못 받아 적었어요.\n\n음성 인식 특성상 고유명사(사람 이름, 기관명, 사업명)나 겹쳐서 말하는 구간, 마이크가 먼 발언은 틀릴 수 있습니다.\n속기록은 초안으로 활용하시고, 공식 문서로 쓸 때는 반드시 영상과 대조해 확인하세요.\n\n### Q4. 컴퓨터가 느려져요.\n\n음성 인식은 CPU를 많이 사용합니다.\n\n- 전사 주기를 **30초 또는 60초**로 늘리세요.\n- 다른 무거운 프로그램을 닫아 주세요.\n- ⑤ 뷰어의 영상 재생을 멈춰도 속기에는 영향이 없습니다.\n\n### Q5. 프로그램을 껐다 켰더니 예전 속기록이 그대로 있어요.\n\n정상입니다. 속기록은 자동 저장되며 다시 켜면 불러옵니다. 새로 시작하려면 [4-6. 기록 삭제](#4-6-기록-삭제-새로-시작하기)를 이용하세요.\n\n### Q6. [기록 삭제]를 눌렀는데 \"전사 중에는 삭제할 수 없습니다\"가 떠요.\n\n속기 중에는 삭제할 수 없습니다. [중지]를 누른 뒤 몇 초 후에 다시 시도하세요.\n\n### Q7. [전문 복사]가 안 돼요.\n\n화면 아래에 \"클립보드 복사에 실패했습니다.\"가 뜨면 [내보내기] → 텍스트(.txt)로 저장한 뒤 파일을 열어 복사하세요.\n\n### Q8. 실행하자마자 꺼지거나 창이 하얗게 나와요.\n\n- `YouTubeLiveTranscriber.exe`, `ffmpeg.exe`, `_internal` 폴더가 같은 폴더에 있는지 확인하세요.\n- zip 파일 안에서 바로 실행하면 동작하지 않습니다. 반드시 압축을 푼 뒤 실행하세요.\n- 압축 파일이 2개로 나뉘어 있다면 두 파일을 모두 **같은 폴더에** 풀었는지 확인하세요. ([2-2. 설치](#2-2-설치) 참고)\n- 화면 디자인 요소를 인터넷에서 불러오므로, 인터넷이 끊기면 화면이 깨져 보일 수 있습니다.\n- Microsoft Edge WebView2 런타임이 없는 PC라면 Microsoft 홈페이지에서 설치하세요.\n\n### Q9. 여러 개를 동시에 켤 수 있나요?\n\n한 번에 하나만 사용하세요. 같은 폴더에서 두 개를 실행하면 속기록 파일이 서로 덮어써질 수 있습니다.\n\n---\n\n*YouTube Live AI Transcriber v1.2 사용설명서 · 2026. 10. 15.*\n";

  if (main) main.closest('p').style.breakBefore = 'auto';
